<!DOCTYPE html>
<html lang="zh-CN">
<head>

    This is a placeholder for base href that will be replaced by the value of

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="课间 — 一个离线优先的开源大学课程表。">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">

<body style="margin:0;background:#F7F8F4">
  <div id="loading" style="position:fixed;inset:0;display:grid;place-items:center;font-family:system-ui;color:#526C59"><div style="text-align:center"><div style="font-size:32px;font-weight:700;letter-spacing:6px">课间</div><p style="font-size:13px;opacity:.65">给每一堂课，留一点从容。</p></div></div>
  <script>window.addEventListener("flutter-first-frame",()=>document.getElementById("loading")?.remove());</script>
  <!--

  <script src="ocr_bridge.js" defer></script>
