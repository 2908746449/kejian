name: kejian
description: 课间 — 一个离线优先的开源大学课程表。
publish_to: none
version: 0.3.1+4
environment:
  sdk: '>=3.13.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  sqflite: ^2.4.5
  shared_preferences: ^2.5.6
  file_picker: ^13.3.2
  cupertino_icons: ^1.0.8
  pdfrx: ^2.12.0
  pdfrx_engine: ^0.9.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter
flutter:
  config:
    enable-swift-package-manager: true
  uses-material-design: true
  assets:
    - assets/fonts/OFL.txt
    - assets/licenses/
  fonts:
    - family: NotoSansSC
      fonts:
        - asset: assets/fonts/NotoSansSC.ttf
