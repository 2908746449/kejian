name: Mobile builds
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'lib/**'
      - 'ios/**'
      - 'android/**'
      - 'pubspec.*'
      - '.github/workflows/mobile.yml'
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          cache: true
      - run: flutter pub get
      - run: flutter build apk --debug --target-platform android-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: kejian-android-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          cache: true
      - run: flutter pub get
      - run: python3 tool/check_ios_project.py
      - run: |
          swiftc ios/Shared/WidgetSnapshot.swift tool/check_widget_snapshot.swift -o "$RUNNER_TEMP/check-widget"
          "$RUNNER_TEMP/check-widget" examples/widget-snapshot.json
      - run: flutter build ios --simulator --debug --no-codesign
      - run: ditto -c -k --sequesterRsrc --keepParent build/ios/iphonesimulator/Runner.app "$RUNNER_TEMP/kejian-ios-simulator.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: kejian-ios-simulator
          path: ${{ runner.temp }}/kejian-ios-simulator.zip
